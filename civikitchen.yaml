$schema: https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  license: Proprietary
  npm_license: UNLICENSED
  copyright: 'civico GmbH'

  # The headless suite runs comfortably above this; the gap leaves room for a
  # DAO stub or a subscriber registration without a red build.
  coverage:
    minimum: 85

  # hook_civicrm_searchKitTasks belongs to search_kit, which lives under
  # core/ext where the checker does not look for a <requires> extension.
  known_hooks:
    - searchKitTasks

  hook_style: listener

  # phpstanBootstrap.php: the required extensions (authx, afform, search_kit)
  # are bundled under core/ext, which the template's ext-dir-only lookup does
  # not reach; it also aliases the civix DAO base class.
  # tests/e2e/lib.sh: the suites live in tests/e2e/measure/ with their own
  # helpers — token minting and curl-from-stdin, no maildev.
  template_custom:
    paths:
      - phpstanBootstrap.php
      - tests/e2e/lib.sh
    reason: Bundled-extension autoloading and an e2e suite in a subdirectory
